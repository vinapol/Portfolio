# Publie UNIQUEMENT le dossier dist/ (bundle Vite hashé).
# Dans GitHub : Settings → Pages → Source = GitHub Actions
# (pas « Deploy from a branch » / main / root, sinon le index.html source
#  et /src/main.jsx sont servis tels quels → page blanche).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Vérifier le HTML de production
        run: |
          set -euo pipefail
          test -f dist/index.html
          if grep -F 'src/main.jsx' dist/index.html; then
            echo "::error::dist/index.html référence encore src/main.jsx — Pages servirait le source au lieu du bundle."
            exit 1
          fi
          if ! grep -E 'src="\./assets/index-[^"]+\.js"' dist/index.html; then
            echo "::error::dist/index.html ne référence pas le bundle hashé ./assets/index-*.js"
            exit 1
          fi
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
